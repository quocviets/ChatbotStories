services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_story_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_story_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 

  redis:
    image: redis:7.2-alpine
    container_name: ai_story_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: ai_story_web
    restart: always
    env_file:
      - API/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ai_story_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./AI_engine:/workspace/AI_engine
      - ./API:/workspace/API
    depends_on:
      - db
      - redis

volumes:
  pgdata:
