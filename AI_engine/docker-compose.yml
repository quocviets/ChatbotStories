services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_story_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Quocviet160423
      POSTGRES_DB: ai_story_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: ai_story_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: ai_story_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:Quocviet160423@db:5432/ai_story_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - .:/workspace

volumes:
  pgdata:
