[tool.ruff]
line-length = 100
target-version = "py311"
src = ["AI_engine/app", "API", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
